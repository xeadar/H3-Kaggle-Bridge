name: H3 Bridge - Launch S03 8s

on:
  push:
    paths:
      - .github/workflows/launch-s03-8s.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h3-bridge-s03-8s
  cancel-in-progress: false

jobs:
  launch-s03:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SOURCE_KERNEL: sita2ksitas/garden-tales-v20-h3-pv-s02
      TARGET_KERNEL: sita2ksitas/garden-tales-v20-h3-pv-s03
      INPUT_DATASET: sita2ksitas/h3-pv-hangover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet 'kaggle==2.2.4'

      - name: Pull proven S02 notebook
        run: |
          set -euo pipefail
          rm -rf .bridge/s03 && mkdir -p .bridge/s03
          kaggle kernels pull "$SOURCE_KERNEL" -p .bridge/s03 -m
          find .bridge/s03 -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Patch S03 production configuration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          root=Path('.bridge/s03')
          nbs=list(root.glob('*.ipynb'))
          if len(nbs)!=1:
              raise SystemExit(f'Expected one notebook, found {[p.name for p in nbs]}')
          src=nbs[0]
          nb=json.loads(src.read_text(encoding='utf-8'))

          prompt="""How the reference pictures align with the target video — Picture 1 aligns with the 0.00-second mark of the target video; Picture 2 aligns with the 8.00-second mark of the target video.

integrated_multimodal_description: [Shot 1] Live-action, photorealistic. The woman begins exactly from the position, scale, body orientation, and framing established by Picture 1. The shallow depth of field and softly blurred background in Picture 1 are preserved naturally at the beginning.

Still visibly intoxicated and unsteady, she begins crawling slowly toward the location established by Picture 2.

Her crawling is natural but clumsy from drunkenness. Her arms and legs work together to move her forward: she alternates her weight between her hands and forearms while her knees and feet make small, uneven pushes against the floor. Her hips, torso, and legs all participate naturally in the movement, with slightly delayed, unstable coordination caused by intoxication.

Each crawling cycle produces clear forward displacement through the environment. Her pace remains slow and heavy, with uneven rhythm, small balance corrections, and occasional brief hesitation as she continues toward the destination.

The camera follows behind her in a low rear Tracking Shot, moving smoothly at roughly the same pace and maintaining a consistent rear perspective and similar viewing distance as she crawls.

Around the middle of the crawl, she lets out one brief natural fart. Her body gives a tiny involuntary pause and slight tension for a moment, then she continues crawling without making a dramatic reaction.

As she gets closer, the spatial difference between her current position and Picture 2 steadily decreases. She continues crawling until her position, orientation, scale, body posture, spatial relationship, and framing naturally converge with Picture 2 at the end of the shot.

overall_soundscape: Soft hand and knee contact against the floor, subtle clothing movement, slightly uneven breathing, one brief natural fart during the middle of the crawl, and quiet environmental ambience synchronized with her movement.

non_diegetic_music: N/A"""
          (root/'prompt.sha256').write_text(hashlib.sha256(prompt.encode()).hexdigest()+'\n',encoding='utf-8')

          config=("# S03 production: 768x1664 / 8 s / 20 steps / FL2VA first+last.\n"
                  "CONFIG = {\n"
                  " 'mode': 'generate',\n"
                  " 'first_frame': 'S03_FIRST_FRAME.HEIC',\n"
                  " 'last_frame': 'S03_LAST_FRAME.HEIC',\n"
                  f" 'prompt': {prompt!r},\n"
                  " 'seconds': 8,\n"
                  " 'width': 768,\n"
                  " 'height': 1664,\n"
                  " 'steps': 20,\n"
                  " 'seed': 2026092501,\n"
                  " 'timeout_minutes': 660,\n"
                  " 'verify_model_hashes': False}\n")

          config_hits=0
          gpu_hits=0
          for cell in nb.get('cells',[]):
              s=cell.get('source','')
              text=''.join(s) if isinstance(s,list) else s
              if cell.get('cell_type')=='code' and 'CONFIG = {' in text and 'first_frame' in text:
                  cell['source']=config
                  cell['outputs']=[]
                  cell['execution_count']=None
                  config_hits+=1
              if "g['20']=node('H3MSGPUSet'" in text:
                  known=[
                      "g['20']=node('H3MSGPUSet',gpus='0,1',exclude='',shares='1,1',min_free_vram_gb=0.0,max_gpus=2)",
                      "g['20']=node('H3MSGPUSet',gpus='0,1',exclude='',shares='0.6,1.4',min_free_vram_gb=0.0,max_gpus=2)",
                      "g['20']=node('H3MSGPUSet',gpus='0,1',exclude='',shares='0.85,1.15',min_free_vram_gb=0.0,max_gpus=2)",
                  ]
                  matched=[x for x in known if x in text]
                  if len(matched)!=1:
                      raise SystemExit(f'Unexpected H3MSGPUSet configuration; matched {len(matched)} known variants')
                  target_gpu=known[-1]
                  if matched[0]!=target_gpu:
                      text=text.replace(matched[0],target_gpu,1)
                      cell['source']=text
                  gpu_hits+=1
          if config_hits!=1 or gpu_hits!=1:
              raise SystemExit(f'Patch mismatch config={config_hits} gpu={gpu_hits}')

          target=root/'garden-tales-v20-s03.ipynb'
          target.write_text(json.dumps(nb,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          if src!=target:
              src.unlink()

          mp=root/'kernel-metadata.json'
          meta=json.loads(mp.read_text(encoding='utf-8'))
          meta['id']='sita2ksitas/garden-tales-v20-h3-pv-s03'
          meta['title']='Garden Tales v20 H3 PV S03'
          meta['code_file']=target.name
          ds=[x for x in (meta.get('dataset_sources') or []) if x]
          if 'sita2ksitas/h3-pv-hangover' not in ds:
              ds.append('sita2ksitas/h3-pv-hangover')
          meta['dataset_sources']=ds
          meta['enable_gpu']=True
          meta['enable_internet']=True
          mp.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print(json.dumps({
              'target_kernel':meta['id'],
              'input_dataset':'sita2ksitas/h3-pv-hangover',
              'first_frame':'S03_FIRST_FRAME.HEIC',
              'last_frame':'S03_LAST_FRAME.HEIC',
              'seconds':8,
              'width':768,
              'height':1664,
              'steps':20,
              'seed':2026092501,
              'expected_frames':192,
              'timeout_minutes':660,
              'multistream_shares':'0.85,1.15'
          },ensure_ascii=False,indent=2))
          PY

      - name: Save and Run All
        id: push
        run: |
          set -euo pipefail
          kaggle kernels push -p .bridge/s03 | tee .bridge/push.log
          python - <<'PY'
          import os,re
          s=open('.bridge/push.log',encoding='utf-8',errors='replace').read()
          m=re.search(r'https://www\.kaggle\.com/(?:code/)?([^/\s]+)/([^\s]+)',s)
          if not m:
              raise SystemExit('Could not parse actual Kaggle kernel URL')
          actual=f'{m.group(1)}/{m.group(2)}'.rstrip('.,)')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              print('ACTUAL_KERNEL='+actual,file=f)
          print('ACTUAL_KERNEL='+actual)
          PY

      - name: Confirm Kaggle accepted
        id: status
        run: |
          set -euo pipefail
          accepted=0
          for i in $(seq 1 30); do
            out="$(kaggle kernels status "$ACTUAL_KERNEL" 2>&1 || true)"
            printf '%s\n' "$out" | tee .bridge/status.log
            low="$(printf '%s' "$out" | tr '[:upper:]' '[:lower:]')"
            if [[ "$low" == *running* || "$low" == *queued* || "$low" == *complete* ]]; then accepted=1; break; fi
            if [[ "$low" == *error* || "$low" == *failed* ]]; then exit 1; fi
            sleep 10
          done
          [ "$accepted" -eq 1 ]

      - name: Write receipt
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
        run: |
          mkdir -p results
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          psha=''
          if os.path.exists('.bridge/s03/prompt.sha256'):
              psha=open('.bridge/s03/prompt.sha256',encoding='utf-8').read().strip()
          payload={
            'state':'submitted' if os.environ.get('PUSH_OUTCOME')=='success' and os.environ.get('STATUS_OUTCOME')=='success' else 'failed',
            'shot':'S03',
            'source_kernel':'sita2ksitas/garden-tales-v20-h3-pv-s02',
            'target_kernel':'sita2ksitas/garden-tales-v20-h3-pv-s03',
            'actual_kernel':os.environ.get('ACTUAL_KERNEL'),
            'input_dataset':'sita2ksitas/h3-pv-hangover',
            'first_frame':'S03_FIRST_FRAME.HEIC',
            'last_frame':'S03_LAST_FRAME.HEIC',
            'seconds':8,'width':768,'height':1664,'steps':20,'seed':2026092501,
            'expected_frames':192,'timeout_minutes':660,'multistream_shares':'0.85,1.15',
            'prompt_sha256':psha,
            'kaggle_status':open('.bridge/status.log',encoding='utf-8',errors='replace').read()[-2000:] if os.path.exists('.bridge/status.log') else None,
            'github_run':f"https://github.com/{os.environ.get('REPOSITORY')}/actions/runs/{os.environ.get('RUN_ID')}",
            'updated_at':datetime.now(timezone.utc).isoformat()
          }
          with open('results/launch-s03.json','w',encoding='utf-8') as f:
              json.dump(payload,f,ensure_ascii=False,indent=2);f.write('\n')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY

      - name: Commit receipt
        if: always()
        run: |
          git config user.name 'h3-kaggle-bridge[bot]'
          git config user.email 'h3-kaggle-bridge[bot]@users.noreply.github.com'
          git add results/launch-s03.json
          git diff --cached --quiet && exit 0
          git commit -m 'Report S03 launch [skip ci]'
          git pull --rebase origin main
          git push

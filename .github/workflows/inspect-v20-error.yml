name: H3 Bridge - Inspect v20 Error

on:
  push:
    paths:
      - control/inspect-v20-error.json

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL: sita2ksitas/garden-tales-v20-h3-pv-s01

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet 'kaggle==2.2.4'
      - name: Download errored kernel output
        run: |
          set -euo pipefail
          rm -rf .bridge/v20-error && mkdir -p .bridge/v20-error
          kaggle kernels output "$KERNEL" -p .bridge/v20-error -o || true
          echo '--- FILES ---'
          find .bridge/v20-error -type f -printf '%P\t%s bytes\n' | sort
      - name: Extract exact execution error
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.bridge/v20-error')
          for p in root.rglob('history.json'):
              try: d=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              st=d.get('status',{}) if isinstance(d,dict) else {}
              for item in st.get('messages',[]):
                  if not isinstance(item,list) or len(item)!=2: continue
                  kind,data=item
                  if kind!='execution_error' or not isinstance(data,dict): continue
                  out={k:data.get(k) for k in ('node_id','node_type','exception_type','exception_message')}
                  tb=data.get('traceback') or []
                  if tb: out['traceback_tail']=tb[-8:]
                  print('EXACT_EXECUTION_ERROR')
                  print(json.dumps(out,ensure_ascii=False,indent=2))
          for p in root.rglob('report.json'):
              try: d=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              print('REPORT_STATUS',d.get('status'))
              err=d.get('error')
              if err: print('REPORT_ERROR_TAIL\n'+str(err)[-5000:])
          PY
